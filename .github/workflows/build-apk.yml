name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          cat android/local.properties
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps

      - name: Build Web Application Bundle
        working-directory: ./client
        run: npm run build
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          GENERATE_SOURCEMAP: "false"

      - name: Make Gradle executable & fix line endings
        run: |
          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          npx cap sync android
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          // Fallback cordova.variables.gradle
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          echo "=== Searching for APK files in repository ==="
          find . -name "*.apk"
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/UniCore-app.apk
            echo "Successfully copied $APK_FILE to release-output/UniCore-app.apk"
            ls -lh release-output/UniCore-app.apk
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniCore-Android-APK
          path: release-output/UniCore-app.apk
          retention-days: 30

      - name: Debug On Failure
        if: failure()
        run: |
          echo "### ❌ Build Failure Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle-build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "=== Listing android files ==="
          find android/ -maxdepth 4 || true

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-logs
          path: gradle-build.log

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0-apk
          name: UniCore Mobile App v1.1.0 (Android test APK)
          body: |
            UniCore Android 1.1.0 includes Android 13 notification permission handling,
            device registration, notification settings and a self-test button.
            It also includes native file saving/sharing, printing, camera/microphone
            permissions and bundled app screens with an offline connection notice.

            Install the updated APK and sign in, then open Settings > App notifications
            to enable notifications and send a test to your own phone. The updated
            backend must be deployed for device registration and push delivery.

            App screens are bundled: frontend changes require a new APK installation.
            This is a debug-signed test build. Delivery and calls need device testing;
            full native incoming-call ringing/answer controls are not included.
          files: release-output/UniCore-app.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

