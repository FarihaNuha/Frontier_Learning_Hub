name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          cat android/local.properties
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        # Client dependencies are installed explicitly in the next step.
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Client Dependencies
        working-directory: ./client
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Build Web Application Bundle
        # Notification, message and call tests use isolated adapters; no live users.
        working-directory: ./client
        run: npm run build
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          GENERATE_SOURCEMAP: "false"

      - name: Test Notification, Chat and Call Flows
        run: |
          npm --prefix server ci
          npm --prefix server run test-push
          npm --prefix server run test-chat
          npm --prefix client test -- --watchAll=false --runInBand --runTestsByPath src/services/nativeBridge.test.js src/services/nativeFiles.test.js src/contexts/CallContext.test.jsx src/pages/MessagePage.test.jsx

      - name: Make Gradle executable & fix line endings
        run: |
          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          npx cap sync android
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          // Fallback cordova.variables.gradle
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          EOF
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          echo "=== Searching for APK files in repository ==="
          find . -name "*.apk"
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/UniCore-app.apk
            echo "Successfully copied $APK_FILE to release-output/UniCore-app.apk"
            ls -lh release-output/UniCore-app.apk
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniCore-Android-APK
          path: release-output/UniCore-app.apk
          retention-days: 30

      - name: Debug On Failure
        if: failure()
        run: |
          echo "### ❌ Build Failure Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle-build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "=== Listing android files ==="
          find android/ -maxdepth 4 || true

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-logs
          path: gradle-build.log

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.3.1-apk
          name: UniCore Mobile App v1.3.1 (Android test APK)
          body: |
            UniCore Android 1.3.1 reduces chat reloads and database queries and limits
            lecture, assignment and exam notifications to the selected course cohort.
            Push delivery runs through a durable background outbox without blocking API responses.
            The app includes the supplied UniCore logo and groups unread messages by conversation and removes
            duplicate socket/FCM phone alerts. Tap a message or its menu for reply,
            forward, reactions, copy, edit, delete for me or delete for everyone.
            Read receipts sync across signed-in devices.

            Expand a chat notification to see up to 25 recent messages, Reply,
            Like and Dismiss. Inline replies retry connection failures without
            sending duplicate messages. Dismiss does not mark the chat read.

            Incoming audio/video calls now have a global call screen, queued ICE
            candidates, busy checks, answer/decline, timeout and media cleanup.
            Android includes native incoming-call Answer/Decline and screen sharing
            with a system capture permission dialog. Android controls full-screen UI.
            Reliable calls across restricted networks still require a configured
            TURN relay. Calls are not a native foreground calling service.

            Install this APK on both phones and sign in. In Settings > App notifications,
            tap Enable / reconnect notifications to register the new native renderer.
            This is a debug-signed test build; frontend changes require a new APK.
          files: release-output/UniCore-app.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

